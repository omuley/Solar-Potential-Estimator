name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]    

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./server
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                node-version: '24'
            - run: npm install
            - run: npm run lint
            - run: npm test
    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./client
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                node-version: '24'
            - run: npm install
            - run: npm run lint
            - run: npm run build
            - run: npm test

